<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPanel · Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-login">

    <div class="login-wrapper">

        <!-- Panel izquierdo -->
        <div class="login-panel-left">
            <div class="brand">
                <div class="brand-icon brand-icon--lg">🎓</div>
                <span class="brand-name brand-name--lg">EduPanel</span>
            </div>

            <div class="login-stats">
                <div class="stat-card">
                    <div class="stat-num">TOP 10</div>
                    <div class="stat-label">Ranking académico en tiempo real</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num">360°</div>
                    <div class="stat-label">Análisis de desempeño estudiantil</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num">⚡</div>
                    <div class="stat-label">Actualización automática cada 10s</div>
                </div>
            </div>

            <p class="login-tagline">Plataforma de gestión y análisis de notas estudiantiles con visualizaciones en tiempo real.</p>
        </div>

        <!-- Panel formulario -->
        <div class="login-panel-right">
            <h1 class="login-title">Bienvenido</h1>
            <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

            <form method="POST">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" name="username" id="username" placeholder="Tu nombre de usuario">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit btn-submit--accent">Ingresar al sistema →</button>
            </form>
        </div>

    </div>

</body>
</html>
